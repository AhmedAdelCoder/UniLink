name: unilink
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management and utilities
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Functional error handling (Either)
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^7.6.7

  # Firebase core + services
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.1
  firebase_messaging: ^15.1.5

  # Local storage for simple persistence (theme, small caches)
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
