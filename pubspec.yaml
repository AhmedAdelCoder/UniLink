name: unilink
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management and utilities
  flutter_bloc: ^9.0.0
  bloc: ^9.0.0
  equatable: ^2.0.5

  # Functional error handling (Either)
  dartz: ^0.10.1

  # Dependency injection
  get_it: ^7.6.7

  # Firebase core + services
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.5.1
  firebase_storage: ^12.3.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^21.0.0   # ← هنا اضبط المسافة زي باقي التبعيات

  # Local storage for simple persistence (theme, small caches)
  shared_preferences: ^2.3.2

  # UI & images
  smooth_page_indicator: ^1.2.0+3
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/unilink_logo.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/unilink_logo.png"